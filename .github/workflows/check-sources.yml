name: Check public result sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public downloads
        run: |
          python - <<'PY'
          import urllib.request, re
          urls = [
            'https://takarakuji.rakuten.co.jp/backnumber/loto6/',
            'https://takarakuji.rakuten.co.jp/backnumber/loto7/',
            'https://loto6.thekyo.jp/data/loto6.csv',
            'https://loto7.thekyo.jp/data/loto7.csv',
          ]
          for url in urls:
            try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=25) as r:
                raw = r.read()
                print(url, 'HTTP', r.status, 'bytes', len(raw))
                if url.endswith('.csv'):
                  text = raw.decode('cp932')
                  lines = text.splitlines()
                  print('first:', lines[:2], 'last:', lines[-2:])
                else:
                  text = raw.decode('utf-8')
                  print('rounds:', re.findall(r'第\d+回', text)[:5])
            except Exception as exc:
              print(url, type(exc).__name__, str(exc))
          PY
