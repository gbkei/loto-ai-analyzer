name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Update lottery draw results]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site/data
          cp index.html sw.js manifest.webmanifest icon.svg _site/
          cp data/latest.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
